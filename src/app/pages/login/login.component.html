<app-banner
  src="assets/imagens/banner-login.png"
  alt="Banner da tela de login"
></app-banner>
<section class="login-component">
  <mat-card class="login">
    <div class="image-container">
      <figure>
        <img
          src="assets/imagens/simbolo-bussola.png"
          alt="Simbolo de uma bussola laranja"
        />
      </figure>
    </div>
    <div class="form-container">
      <mat-card-header>
        <mat-card-title>Login</mat-card-title>
      </mat-card-header>
      <form [formGroup]="loginForm">
        <mat-card-content>
          <mat-form-field appearance="outline">
            <mat-label>E-mail</mat-label>
            <input
              formControlName="email"
              matInput
              type="email"
              placeholder="Digite seu e-mail"
              required
            />
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
              E-mail é obrigatório
            </mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
              E-mail inválido
            </mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Senha</mat-label>
            <input
              formControlName="senha"
              matInput
              type="password"
              placeholder="Digite sua senha"
              required
            />
            <mat-error *ngIf="loginForm.get('senha')?.hasError('required')">
              Senha é obrigatória
            </mat-error>
          </mat-form-field>
          <mat-card-actions>
            <button
              [disabled]="loginForm.invalid"
              (click)="login()"
              mat-raised-button
              color="primary"
              type="submit"
            >
              Acessar minha conta
            </button>
          </mat-card-actions>
        </mat-card-content>
        <p>
          Ainda nao possui conta?
          <a [routerLink]="routerLink"
            ><strong><u></u></strong> aqui para se cadastrar</a
          >
        </p>
      </form>
    </div>
  </mat-card>
</section>
