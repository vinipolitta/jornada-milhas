<app-banner
  src="assets/imagens/banner-login.png"
  alt="Banner da tela de login"
></app-banner>
<section class="login-component">
  <mat-card class="login">
    <div class="image-container">
      <figure>
        <img
          src="assets/imagens/simbolo-bussola.png"
          alt="Simbolo de uma bussola laranja"
        />
      </figure>
    </div>
    <div class="form-container">
      <mat-card-header>
        <mat-card-title>Login</mat-card-title>
      </mat-card-header>
      <form>
        <mat-card-content>
          <mat-form-field appearance="outline">
            <mat-label>E-mail</mat-label>
            <input
              matInput
              type="email"
              placeholder="Digite seu e-mail"
              required
            />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Senha</mat-label>
            <input
              matInput
              type="password"
              placeholder="Digite sua senha"
              required
            />
          </mat-form-field>
          <mat-card-actions>
            <button mat-raised-button color="primary" type="submit">
              Acessar minha conta
            </button>
          </mat-card-actions>
        </mat-card-content>
        <p>
          Ainda nao possui conta?
          <a href=""
            ><strong><u></u></strong> aqui para se cadastrar</a
          >
        </p>
      </form>
    </div>
  </mat-card>
</section>
